<!doctype html>
<html lang="en">
<head>

<title>pdx1 sacred geometry logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">
<div style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.12em; color: #8FA3B8"><span>SACRED GEOMETRY</span><span>03 / 05</span></div>

<defs>
<symbol id="spx-mark" viewBox="0 0 240 240">
<circle cx="120" cy="124" r="90" fill="none" stroke="#D7DEE6" stroke-width="1.4"></circle>
<circle cx="120" cy="124" r="45" fill="none" stroke="#5E7591" stroke-width="1"></circle>

<line x1="30" y1="169" x2="210" y2="169" stroke="#8FA3B8" stroke-width="1.2"></line>
<polygon points="120,34 42.1,169 197.9,169" fill="none" stroke="#D7DEE6" stroke-width="1.8"></polygon>
<polygon points="120,64 66,169 174,169" fill="none" stroke="#8FA3B8" stroke-width="1.4"></polygon>
<polygon points="120,94 90,169 150,169" style="fill: var(--accent)"></polygon>
<polygon points="120,94 120,169 150,169" fill="#000000" opacity="0.28"></polygon>
<line x1="120" y1="34" x2="120" y2="214" stroke="#5E7591" stroke-width="0.9" opacity="0.7"></line>
<circle cx="42.1" cy="169" r="3" fill="#D7DEE6"></circle>
<circle cx="197.9" cy="169" r="3" fill="#D7DEE6"></circle>
<circle cx="120" cy="214" r="3" fill="#8FA3B8"></circle>
<circle cx="120" cy="34" r="20" fill="none" stroke-width="1.5" opacity="0.3" style="stroke: var(--accent)"></circle>
<circle cx="120" cy="34" r="13" fill="none" stroke-width="1.5" opacity="0.55" style="stroke: var(--accent)"></circle>
<circle cx="120" cy="34" r="7" style="fill: var(--accent)"></circle>
<circle cx="118" cy="32" r="2.5" fill="#FFFFFF" opacity="0.7"></circle>

<use href="#spx-mark" width="240" height="240"></use>
</svg>
</div>
<div style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">pdx1</div>
