<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=1280">
<title>The Sentinel night watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

<script src="accent.js"></script>
<style>
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.flick{animation:flick 5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.85}40%{opacity:.5}70%{opacity:1}}
.shim{transform-box:fill-box;transform-origin:50% 0;animation:shim 2.6s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.7;transform:scaleX(1)}50%{opacity:.35;transform:scaleX(.6)}}
.beamA,.beamB{transform-box:view-box;animation:beam 9s ease-in-out infinite alternate}
.beamA{transform-origin:842px 402px}
.beamB{transform-origin:1082px 402px;animation-duration:11s;animation-direction:alternate-reverse}
@keyframes beam{0%{transform:rotate(-16deg)}100%{transform:rotate(14deg)}}
.mist{animation:mist 22s ease-in-out infinite alternate}
.mist2{animation-duration:30s;animation-direction:alternate-reverse}
@keyframes mist{0%{transform:translateX(-60px)}100%{transform:translateX(60px)}}
.cloud{animation:cloud 40s linear infinite}
@keyframes cloud{0%{transform:translateX(-160px)}100%{transform:translateX(220px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
@media (prefers-reduced-motion: reduce){.tw,.blink,.flick,.shim,.beamA,.beamB,.mist,.cloud,.ping,.pulse{animation:none}}
</style>
</head>
