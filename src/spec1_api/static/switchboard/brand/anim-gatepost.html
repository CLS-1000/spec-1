<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>gatepost animated intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="brand.css">
<script src="accent.js"></script>
<style>
.dA,.dB,.dC,.dE{stroke-dasharray:1;stroke-dashoffset:1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.dA{animation-name:dA}.dB{animation-name:dB}.dC{animation-name:dC}.dE{animation-name:dE}
@keyframes dA{0%,2%{stroke-dashoffset:1;opacity:1}16%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dB{0%,10%{stroke-dashoffset:1;opacity:1}26%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dC{0%,16%{stroke-dashoffset:1;opacity:1}30%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dE{0%,46%{stroke-dashoffset:1;opacity:1}56%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.fadeF{animation:fadeF 8s ease-out infinite}
@keyframes fadeF{0%,26%{opacity:0}36%,88%{opacity:1}96%,100%{opacity:0}}
.popJ,.popK,.popL{transform-box:fill-box;transform-origin:center;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.popJ{animation-name:popJ}.popK{animation-name:popK}.popL{animation-name:popL}
@keyframes popJ{0%,24%{transform:scale(0);opacity:1}30%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popK{0%,38%{transform:scale(0);opacity:1}44%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popL{0%,56%{transform:scale(0);opacity:1}62%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.45;transform:scale(1.35)}}
.rH,.rT,.rP{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.rH{animation-name:rH}.rT{animation-name:rT}.rP{animation-name:rP}
@keyframes rH{0%,4%{opacity:0;transform:translateY(14px)}12%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rT{0%,62%{opacity:0;transform:translateY(14px)}70%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rP{0%,68%{opacity:0;transform:translateY(14px)}76%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.wipe{animation:wipe 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes wipe{0%,52%{clip-path:inset(0 100% 0 0);opacity:1}64%,88%{clip-path:inset(0 0 0 0);opacity:1}96%,100%{clip-path:inset(0 0 0 0);opacity:0}}
@media (prefers-reduced-motion: reduce){.dA,.dB,.dC,.dE{animation:none;stroke-dashoffset:0}.fadeF,.popJ,.popK,.popL,.glow,.rH,.rT,.rP,.wipe{animation:none}}
</style>
</head>
<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">
<div class="rH" style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.12em; color: #8FA3B8"><span>SWITCHBOARD SYSTEM</span><span>05 / 05</span></div>
<div style="grid-column: 1; grid-row: 1 / 6; display: flex; align-items: center; justify-content: center">
<svg width="500" height="500" viewBox="0 0 240 240" role="img" aria-label="Animated gatepost mark: two overlapping circles draw a pointed arch, the keyhole appears, and a check mark is written beneath it" style="filter: drop-shadow(3px 4px 0 #050B14)">
<circle class="dA" pathLength="1" cx="80" cy="150" r="80" fill="none" stroke="#5E7591" stroke-width="1" opacity="0.8"></circle>
<circle class="dA" pathLength="1" cx="160" cy="150" r="80" fill="none" stroke="#5E7591" stroke-width="1" opacity="0.8"></circle>
<line class="dA" pathLength="1" x1="80" y1="150" x2="160" y2="150" stroke="#8FA3B8" stroke-width="1"></line>
<line class="dA" pathLength="1" x1="120" y1="56" x2="120" y2="214" stroke="#5E7591" stroke-width="0.9" opacity="0.7"></line>
<path class="fadeF" d="M64 200 L64 150 A96 96 0 0 1 120 62.7 A96 96 0 0 1 176 150 L176 200 Z" fill="#5E7591"></path>
<path class="dB" pathLength="1" d="M64 200 L64 150 A96 96 0 0 1 120 62.7 A96 96 0 0 1 176 150 L176 200" fill="none" stroke="#D7DEE6" stroke-width="2"></path>
<path class="fadeF" d="M80 200 L80 150 A80 80 0 0 1 120 80.7 A80 80 0 0 1 160 150 L160 200 Z" fill="#0E1A2B"></path>
<path class="dC" pathLength="1" d="M80 200 L80 150 A80 80 0 0 1 120 80.7 A80 80 0 0 1 160 150 L160 200" fill="none" stroke="#D7DEE6" stroke-width="1.4"></path>
<line class="dA" pathLength="1" x1="30" y1="200" x2="210" y2="200" stroke="#D7DEE6" stroke-width="1.6"></line>
<g class="popJ"><circle cx="80" cy="150" r="3" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="160" cy="150" r="3" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="120" cy="54" r="6" fill="#D7DEE6"></circle><circle cx="118" cy="52" r="2" fill="#FFFFFF" opacity="0.7"></circle></g>
<g class="popL"><circle class="glow" cx="120" cy="124" r="16" style="fill: var(--accent)"></circle></g>
<g class="popK"><circle cx="120" cy="124" r="8" style="fill: var(--accent)"></circle></g>
<path class="dE" pathLength="1" d="M108 150 L117 161 L134 138" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--accent)"></path>
</svg>
</div>
<div class="wipe" style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">gatepost</div>
<div class="rT" style="grid-column: 2; grid-row: 4; font-size: 16px; color: #8FA3B8">Secure, verified ballots · the way through</div>
<div class="rP" style="grid-column: 2; grid-row: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid #24344A; padding-top: 20px; font-size: 15px; letter-spacing: 0.04em">
<span>Part of SWITCHBOARD</span><span style="color: var(--accent)">·</span><span>its own function &amp; repo</span>
</div>
</div>
</body>
</html>
