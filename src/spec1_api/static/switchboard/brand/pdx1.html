<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=1280">
<title>pdx1 logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">

<line x1="51" y1="157" x2="189" y2="157" stroke="#0E1A2B" stroke-width="5"></line>
<line x1="74" y1="121" x2="166" y2="121" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"></line>
<line x1="51" y1="160" x2="189" y2="160" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"></line>

<polygon points="72,124 72,196 108,196" style="fill: var(--accent)"></polygon>
<polygon points="72,124 72,196 108,196" fill="#000000" opacity="0.3"></polygon>

<circle cx="120" cy="34" r="15" fill="none" stroke-width="2" opacity="0.45" style="stroke: var(--accent)"></circle>
<circle cx="120" cy="34" r="7" style="fill: var(--accent)"></circle>
<circle cx="118" cy="32" r="2.5" fill="#FFFFFF" opacity="0.7"></circle>

<use href="#pdx-mark" width="240" height="240"></use>

<div style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">pdx1</div>
<div style="grid-column: 2; grid-row: 4; font-size: 16px; color: #8FA3B8">Portland node · home of proc_track</div>
