<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>pdx1 animated intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="brand.css">
<script src="accent.js"></script>
<style>
.dA,.dB,.dC,.dE{stroke-dasharray:1;stroke-dashoffset:1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.dA{animation-name:dA}.dB{animation-name:dB}.dC{animation-name:dC}.dE{animation-name:dE}
@keyframes dA{0%,2%{stroke-dashoffset:1;opacity:1}16%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dB{0%,10%{stroke-dashoffset:1;opacity:1}26%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dC{0%,18%{stroke-dashoffset:1;opacity:1}36%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dE{0%,30%{stroke-dashoffset:1;opacity:1}44%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.fillUp{transform-box:fill-box;transform-origin:50% 100%;animation:fillUp 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes fillUp{0%,40%{transform:scaleY(0);opacity:1}50%,88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
.popJ,.popL{transform-box:fill-box;transform-origin:center;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.popJ{animation-name:popJ}.popL{animation-name:popL}
@keyframes popJ{0%,26%{transform:scale(0);opacity:1}32%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popL{0%,52%{transform:scale(0);opacity:1}58%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.ping2{animation-delay:1s}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.rH,.rT,.rP{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.rH{animation-name:rH}.rT{animation-name:rT}.rP{animation-name:rP}
@keyframes rH{0%,4%{opacity:0;transform:translateY(14px)}12%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rT{0%,62%{opacity:0;transform:translateY(14px)}70%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rP{0%,68%{opacity:0;transform:translateY(14px)}76%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.wipe{animation:wipe 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes wipe{0%,52%{clip-path:inset(0 100% 0 0);opacity:1}64%,88%{clip-path:inset(0 0 0 0);opacity:1}96%,100%{clip-path:inset(0 0 0 0);opacity:0}}
@media (prefers-reduced-motion: reduce){.dA,.dB,.dC,.dE{animation:none;stroke-dashoffset:0}.fillUp,.popJ,.popL,.ping,.rH,.rT,.rP,.wipe{animation:none}}
</style>
</head>
<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">
<div class="rH" style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.12em; color: #8FA3B8"><span>SWITCHBOARD SYSTEM</span><span>03 / 05</span></div>
<div style="grid-column: 1; grid-row: 1 / 6; display: flex; align-items: center; justify-content: center">
<svg width="500" height="500" viewBox="0 0 240 240" role="img" aria-label="Animated pdx1 mark: a circle and nested triangles draw into a mountain, the inner peak fills, and a beacon at the summit sends out pulses" style="filter: drop-shadow(3px 4px 0 #050B14)">
<circle class="dA" pathLength="1" cx="120" cy="124" r="90" fill="none" stroke="#D7DEE6" stroke-width="1.4"></circle>
<circle class="dA" pathLength="1" cx="120" cy="124" r="45" fill="none" stroke="#5E7591" stroke-width="1"></circle>
<polygon class="dA" pathLength="1" points="120,214 42.1,79 197.9,79" fill="none" stroke="#5E7591" stroke-width="1" opacity="0.6"></polygon>
<line class="dA" pathLength="1" x1="120" y1="34" x2="120" y2="214" stroke="#5E7591" stroke-width="0.9" opacity="0.7"></line>
<line class="dB" pathLength="1" x1="30" y1="169" x2="210" y2="169" stroke="#8FA3B8" stroke-width="1.2"></line>
<polygon class="dB" pathLength="1" points="120,34 42.1,169 197.9,169" fill="none" stroke="#D7DEE6" stroke-width="1.8"></polygon>
<polygon class="dC" pathLength="1" points="120,64 66,169 174,169" fill="none" stroke="#8FA3B8" stroke-width="1.4"></polygon>
<polygon class="dE" pathLength="1" points="120,94 90,169 150,169" fill="none" stroke-width="1.6" style="stroke: var(--accent)"></polygon>
<g class="fillUp"><polygon points="120,94 90,169 150,169" style="fill: var(--accent)"></polygon><polygon points="120,94 120,169 150,169" fill="#000000" opacity="0.28"></polygon></g>
<g class="popJ"><circle cx="42.1" cy="169" r="3" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="197.9" cy="169" r="3" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="120" cy="214" r="3" fill="#8FA3B8"></circle></g>
<g class="popL">
<circle class="ping" cx="120" cy="34" r="13" fill="none" stroke-width="1.5" style="stroke: var(--accent)"></circle>
<circle class="ping ping2" cx="120" cy="34" r="13" fill="none" stroke-width="1.5" style="stroke: var(--accent)"></circle>
<circle cx="120" cy="34" r="7" style="fill: var(--accent)"></circle>
<circle cx="118" cy="32" r="2.5" fill="#FFFFFF" opacity="0.7"></circle>
</g>
</svg>
</div>
<div class="wipe" style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">pdx1</div>
<div class="rT" style="grid-column: 2; grid-row: 4; font-size: 16px; color: #8FA3B8">A peak within a peak · the Portland node</div>
<div class="rP" style="grid-column: 2; grid-row: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid #24344A; padding-top: 20px; font-size: 15px; letter-spacing: 0.04em">
<span>Part of SWITCHBOARD</span><span style="color: var(--accent)">·</span><span>its own function &amp; repo</span>
</div>
</div>
</body>
</html>
