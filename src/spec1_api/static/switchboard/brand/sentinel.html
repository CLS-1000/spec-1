.wipe{animation:wipe 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes wipe{0%,44%{clip-path:inset(0 100% 0 0);opacity:1}56%,86%{clip-path:inset(0 0 0 0);opacity:1}94%,100%{clip-path:inset(0 0 0 0);opacity:0}}
