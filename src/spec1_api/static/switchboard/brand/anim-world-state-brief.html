<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>World State Brief animated intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="brand.css">
<script src="accent.js"></script>
<style>
.dA,.dB,.dC,.dE{stroke-dasharray:1;stroke-dashoffset:1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.dA{animation-name:dA}.dB{animation-name:dB}.dC{animation-name:dC}.dE{animation-name:dE}
@keyframes dA{0%,2%{stroke-dashoffset:1;opacity:1}16%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dB{0%,10%{stroke-dashoffset:1;opacity:1}24%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dC{0%,18%{stroke-dashoffset:1;opacity:1}32%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dE{0%,32%{stroke-dashoffset:1;opacity:1}46%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.popJ,.popK,.popL{transform-box:fill-box;transform-origin:center;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.popJ{animation-name:popJ}.popK{animation-name:popK}.popL{animation-name:popL}
@keyframes popJ{0%,34%{transform:scale(0);opacity:1}40%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popK{0%,40%{transform:scale(0);opacity:1}46%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popL{0%,46%{opacity:0}50%,88%{opacity:1}96%,100%{opacity:0}}
.orbit{offset-path:path("M20 120 A100 34 0 1 1 220 120 A100 34 0 1 1 20 120");offset-rotate:0deg;animation:orbit 4s linear infinite}
@keyframes orbit{0%{offset-distance:0%}100%{offset-distance:100%}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
.ping2{animation-delay:.7s}.ping3{animation-delay:1.4s}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.rH,.rT,.rP{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.rH{animation-name:rH}.rT{animation-name:rT}.rP{animation-name:rP}
@keyframes rH{0%,4%{opacity:0;transform:translateY(14px)}12%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rT{0%,62%{opacity:0;transform:translateY(14px)}70%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rP{0%,68%{opacity:0;transform:translateY(14px)}76%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.wipe{animation:wipe 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes wipe{0%,52%{clip-path:inset(0 100% 0 0);opacity:1}64%,88%{clip-path:inset(0 0 0 0);opacity:1}96%,100%{clip-path:inset(0 0 0 0);opacity:0}}
@media (prefers-reduced-motion: reduce){.dA,.dB,.dC,.dE{animation:none;stroke-dashoffset:0}.popJ,.popK,.popL,.orbit,.ping,.rH,.rT,.rP,.wipe{animation:none}.orbit{offset-distance:12%}}
</style>
</head>
<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">
<div class="rH" style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.12em; color: #8FA3B8"><span>SWITCHBOARD SYSTEM</span><span>DAILY BRIEF</span></div>
<div style="grid-column: 1; grid-row: 1 / 6; display: flex; align-items: center; justify-content: center">
<svg width="500" height="500" viewBox="0 0 240 240" role="img" aria-label="Animated World State Brief mark: a wireframe globe draws itself, signal points light up across it, and a satellite token circles it on a tilted orbit" style="filter: drop-shadow(3px 4px 0 #050B14)">
<circle class="dA" pathLength="1" cx="120" cy="120" r="72" fill="none" stroke="#D7DEE6" stroke-width="1.8"></circle>
<path class="dB" pathLength="1" d="M48 120 L192 120" stroke="#D7DEE6" stroke-width="1.3"></path>
<path class="dB" pathLength="1" d="M56.6 86 L183.4 86 M56.6 154 L183.4 154 M74 64 L166 64 M74 176 L166 176" stroke="#8FA3B8" stroke-width="1"></path>
<ellipse class="dC" pathLength="1" cx="120" cy="120" rx="24" ry="72" fill="none" stroke="#8FA3B8" stroke-width="1.1"></ellipse>
<ellipse class="dC" pathLength="1" cx="120" cy="120" rx="50" ry="72" fill="none" stroke="#5E7591" stroke-width="1"></ellipse>
<line class="dC" pathLength="1" x1="120" y1="48" x2="120" y2="192" stroke="#8FA3B8" stroke-width="1.1"></line>
<g transform="rotate(-20 120 120)">
<ellipse class="dE" pathLength="1" cx="120" cy="120" rx="100" ry="34" fill="none" stroke-width="1.6" opacity="0.8" style="stroke: var(--accent)"></ellipse>
<g class="popL"><g class="orbit">
<circle cx="0" cy="0" r="12" opacity="0.25" style="fill: var(--accent)"></circle>
<circle cx="0" cy="0" r="6.5" style="fill: var(--accent)"></circle>
<circle cx="-2" cy="-2" r="2.2" fill="#FFFFFF" opacity="0.7"></circle>
</g></g>
</g>
<g class="popJ"><circle class="ping" cx="96" cy="92" r="6" fill="none" stroke-width="1.4" style="stroke: var(--accent)"></circle><circle cx="96" cy="92" r="4" style="fill: var(--accent)"></circle></g>
<g class="popK"><circle class="ping ping2" cx="150" cy="108" r="6" fill="none" stroke-width="1.4" style="stroke: var(--accent)"></circle><circle cx="150" cy="108" r="4" style="fill: var(--accent)"></circle></g>
<g class="popJ"><circle class="ping ping3" cx="128" cy="150" r="6" fill="none" stroke-width="1.4" style="stroke: var(--accent)"></circle><circle cx="128" cy="150" r="4" style="fill: var(--accent)"></circle></g>
<g class="popK"><circle cx="120" cy="48" r="3" fill="#D7DEE6"></circle></g>
<g class="popK"><circle cx="120" cy="192" r="3" fill="#D7DEE6"></circle></g>
</svg>
</div>
<div class="wipe" style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">World State Brief</div>
<div class="rT" style="grid-column: 2; grid-row: 4; font-size: 16px; color: #8FA3B8">The state of the world, in one brief</div>
<div class="rP" style="grid-column: 2; grid-row: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid #24344A; padding-top: 20px; font-size: 15px; letter-spacing: 0.04em">
<span>Part of Notitia Civica</span><span style="color: var(--accent)">·</span><span>a published section</span>
</div>
</div>
</body>
</html>
