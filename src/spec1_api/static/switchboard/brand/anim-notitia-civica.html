<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Notitia Civica animated intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="brand.css">
<script src="accent.js"></script>
<style>
.dA,.dB,.dC,.dE{stroke-dasharray:1;stroke-dashoffset:1;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.dA{animation-name:dA}.dB{animation-name:dB}.dC{animation-name:dC}.dE{animation-name:dE}
@keyframes dA{0%,2%{stroke-dashoffset:1;opacity:1}16%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dB{0%,10%{stroke-dashoffset:1;opacity:1}24%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dC{0%,18%{stroke-dashoffset:1;opacity:1}34%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dE{0%,40%{stroke-dashoffset:1;opacity:1}54%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.popJ,.popL{transform-box:fill-box;transform-origin:center;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.popJ{animation-name:popJ}.popL{animation-name:popL}
@keyframes popJ{0%,30%{transform:scale(0);opacity:1}36%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes popL{0%,50%{transform:scale(0);opacity:1}56%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.5;transform:scale(1.35)}}
.rH,.rT,.rP{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.rH{animation-name:rH}.rT{animation-name:rT}.rP{animation-name:rP}
@keyframes rH{0%,4%{opacity:0;transform:translateY(14px)}12%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rT{0%,62%{opacity:0;transform:translateY(14px)}70%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes rP{0%,68%{opacity:0;transform:translateY(14px)}76%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.wipe{animation:wipe 8s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes wipe{0%,52%{clip-path:inset(0 100% 0 0);opacity:1}64%,88%{clip-path:inset(0 0 0 0);opacity:1}96%,100%{clip-path:inset(0 0 0 0);opacity:0}}
@media (prefers-reduced-motion: reduce){.dA,.dB,.dC,.dE{animation:none;stroke-dashoffset:0}.popJ,.popL,.glow,.rH,.rT,.rP,.wipe{animation:none}}
</style>
</head>
<body>
<div style="width: 1280px; height: 640px; box-sizing: border-box; background: #0E1A2B; color: #F3EEE3; font-family: 'IBM Plex Mono', monospace; display: grid; grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: auto 1fr auto auto auto; column-gap: 64px; row-gap: 20px; padding: 56px 64px 56px 56px">
<div class="rH" style="grid-column: 2; grid-row: 1; display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.12em; color: #8FA3B8"><span>SWITCHBOARD SYSTEM</span><span>CIVIC RECORD</span></div>
<div style="grid-column: 1; grid-row: 1 / 6; display: flex; align-items: center; justify-content: center">
<svg width="500" height="500" viewBox="0 0 240 240" role="img" aria-label="Animated Notitia Civica mark: a civic temple facade draws itself inside a circle, an orange oculus lights in the pediment, and lines of a public notice are written on the base" style="filter: drop-shadow(3px 4px 0 #050B14)">
<circle class="dA" pathLength="1" cx="120" cy="120" r="96" fill="none" stroke="#8FA3B8" stroke-width="1.2"></circle>
<path class="dA" pathLength="1" d="M210 120 L216 120 M120 210 L120 216 M30 120 L24 120 M120 30 L120 24 M183.6 56.4 L187.8 52.2 M183.6 183.6 L187.8 187.8 M56.4 183.6 L52.2 187.8 M56.4 56.4 L52.2 52.2" stroke="#8FA3B8" stroke-width="1.5"></path>
<polygon class="dB" pathLength="1" points="120,48 186,88 54,88" fill="none" stroke="#D7DEE6" stroke-width="1.8" stroke-linejoin="round"></polygon>
<line class="dB" pathLength="1" x1="50" y1="94" x2="190" y2="94" stroke="#D7DEE6" stroke-width="1.6"></line>
<path class="dC" pathLength="1" d="M66 98 L66 158 M93 98 L93 158 M147 98 L147 158 M174 98 L174 158" stroke="#D7DEE6" stroke-width="5" stroke-linecap="round"></path>
<path class="dC" pathLength="1" d="M74 98 L74 158 M101 98 L101 158 M155 98 L155 158 M182 98 L182 158" stroke="#5E7591" stroke-width="1" opacity="0.8"></path>
<path class="dB" pathLength="1" d="M52 164 L188 164 M44 172 L196 172 M36 180 L204 180" stroke="#8FA3B8" stroke-width="1.4"></path>
<path class="dE" pathLength="1" d="M108 108 L132 108 M104 120 L136 120 M110 132 L130 132 M106 144 L134 144" stroke-width="3" stroke-linecap="round" style="stroke: var(--accent)"></path>
<g class="popJ"><circle cx="120" cy="48" r="3.5" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="54" cy="88" r="3" fill="#D7DEE6"></circle></g>
<g class="popJ"><circle cx="186" cy="88" r="3" fill="#D7DEE6"></circle></g>
<g class="popL"><circle class="glow" cx="120" cy="74" r="12" style="fill: var(--accent)"></circle><circle cx="120" cy="74" r="7" style="fill: var(--accent)"></circle><circle cx="118" cy="72" r="2.5" fill="#FFFFFF" opacity="0.7"></circle></g>
</svg>
</div>
<div class="wipe" style="grid-column: 2; grid-row: 3; font-family: 'Oxanium', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1">Notitia Civica</div>
<div class="rT" style="grid-column: 2; grid-row: 4; font-size: 16px; color: #8FA3B8">Civic knowledge, posted in public</div>
<div class="rP" style="grid-column: 2; grid-row: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid #24344A; padding-top: 20px; font-size: 15px; letter-spacing: 0.04em">
<span>Part of SWITCHBOARD</span><span style="color: var(--accent)">·</span><span>the publisher</span>
</div>
</div>
</body>
</html>
