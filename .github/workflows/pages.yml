name: Pages

on:
  push:
    branches: [main]
    paths:
      - spec1_portfolio.html
      - spec1_ui.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          if [ ! -f "spec1_portfolio.html" ]; then
            echo "❌ spec1_portfolio.html not found"
            exit 1
          fi
          if [ ! -f "spec1_ui.html" ]; then
            echo "❌ spec1_ui.html not found"
            exit 1
          fi
          echo "✓ All required files present"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/ui
          cp spec1_portfolio.html _site/index.html
          cp spec1_ui.html _site/ui/index.html
          echo "✓ Site assembled to _site/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
